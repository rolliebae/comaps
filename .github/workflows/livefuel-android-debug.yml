name: LiveFuel Android Debug

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Update submodules shallow and in parallel
        timeout-minutes: 20
        run: |
          git submodule sync --recursive
          git -c protocol.version=2 submodule update \
            --init \
            --recursive \
            --depth 1 \
            --jobs 8

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache jq ninja-build optipng python3 python3-pip python3-venv zlib1g-dev

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;28.2.13676358' \
            'cmake;3.22.1'

      - name: Configure CoMaps
        run: ./configure.sh

      - name: Build arm64 FdroidDebug
        working-directory: android
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: ./gradlew -Parm64 assembleFdroidDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: comaps-livefuel-fdroid-debug-arm64
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
